# Defaults of the shared foundation; the service's own application.yml overrides them.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.otlp.metrics.export.enabled=false
management.tracing.sampling.probability=0.1
# The foundation's tables (db/foundation, versions V0_x) are created before the service's own migrations. A service that sets
# spring.flyway.locations itself must keep classpath:db/foundation in the list.
spring.flyway.locations=classpath:db/migration,classpath:db/foundation
