info:
  title: Order Management API
  version: 1.0.0
  description: "Synchronous operations to place, view and cancel customer orders."
paths:
  /orders:
    post:
      operationId: createOrder
      summary: Place an order
      description: Creates a new order for a customer with one or more line items.
      x-stories:
      - STORY-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order placed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: The request is malformed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The order has no line items or contains an invalid quantity.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /orders/{orderId}:
    get:
      operationId: getOrder
      summary: View order status
      description: Returns an order with its current status.
      x-stories:
      - STORY-003
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: The order does not exist.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /orders/{orderId}/cancellation:
    post:
      operationId: cancelOrder
      summary: Cancel an order
      description: Cancels an order that has not shipped so that its reserved stock
        is released.
      x-stories:
      - STORY-004
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Order cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: The order does not exist.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The order can no longer be cancelled.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  schemas:
    Order:
      type: object
      description: A customer's request to purchase products.
      x-term: LANG-001
      required:
      - lineItems
      - orderId
      - placedAt
      - status
      properties:
        orderId:
          type: string
          format: uuid
        status:
          type: string
          description: "placed, confirmed, rejected or cancelled"
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/LineItem"
        placedAt:
          type: string
          format: date-time
    LineItem:
      type: object
      description: A product entry with the requested quantity.
      x-term: LANG-002
      required:
      - productId
      - quantity
      properties:
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
    CreateOrderRequest:
      type: object
      description: Data needed to place an order.
      required:
      - customerEmail
      - lineItems
      properties:
        customerEmail:
          type: string
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/LineItem"
    Problem:
      type: object
      description: A problem document (RFC 7807).
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
