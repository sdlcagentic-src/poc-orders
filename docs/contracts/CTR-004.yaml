info:
  title: Inventory Management Events
  version: 1.0.0
  description: Events published by Inventory Management about stock checks and releases.
channels:
  inventoryStockChecked:
    address: inventory.stock.checked
    messages:
      publishStockChecked:
        name: publishStockChecked
        summary: Stock checked
        payload:
          $ref: "#/components/schemas/StockCheckedPayload"
  inventoryStockReleased:
    address: inventory.stock.released
    messages:
      publishStockReleased:
        name: publishStockReleased
        summary: Stock released
        payload:
          $ref: "#/components/schemas/StockReleasedPayload"
operations:
  publishStockChecked:
    action: send
    channel:
      $ref: "#/channels/inventoryStockChecked"
    summary: Stock checked
    description: Announces the availability result of the items of an order.
    messages:
    - $ref: "#/channels/inventoryStockChecked/messages/publishStockChecked"
    x-event: LANG-008
  publishStockReleased:
    action: send
    channel:
      $ref: "#/channels/inventoryStockReleased"
    summary: Stock released
    description: Announces that reserved stock returned to available stock.
    messages:
    - $ref: "#/channels/inventoryStockReleased/messages/publishStockReleased"
    x-event: LANG-012
components:
  schemas:
    StockCheckedPayload:
      type: object
      description: Result of the stock check for an order.
      required:
      - allAvailable
      - orderId
      - unavailableProductIds
      properties:
        orderId:
          type: string
          format: uuid
        allAvailable:
          type: boolean
        unavailableProductIds:
          type: array
          items:
            type: string
            format: uuid
    StockReleasedPayload:
      type: object
      description: Stock released back to availability.
      required:
      - orderId
      - productId
      - quantity
      - releasedAt
      properties:
        orderId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
        releasedAt:
          type: string
          format: date-time
