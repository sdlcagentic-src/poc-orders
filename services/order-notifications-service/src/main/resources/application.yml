spring:
  application:
    name: order-notifications-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:notifications}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: order-notifications-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost/jwks}

notifications:
  email:
    gateway-url: ${EMAIL_GATEWAY_URL:http://email-gateway}
    gateway-token: ${EMAIL_GATEWAY_TOKEN:}
